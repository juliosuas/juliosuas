<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="img" aria-label="Pixel cat walking"><line x1="0" y1="36" x2="900" y2="36" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>
<g><animateTransform attributeName="transform" type="translate" values="-50 10;900 10" dur="14s" repeatCount="indefinite"/><g transform="scale(-1,1) translate(-40,0)"><g fill="#5eead4"><rect x="0" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="0" y="8" width="16" height="8"/><rect x="16" y="12" width="20" height="8"/><rect x="36" y="4" width="4" height="10"/></g><g fill="#0b1220"><rect x="4" y="10" width="2" height="2"><animate attributeName="height" values="2;2;0;2" keyTimes="0;0.9;0.95;1" dur="3s" repeatCount="indefinite"/></rect><rect x="10" y="10" width="2" height="2"/></g>
<g fill="#5eead4"><rect x="16" y="20" width="4" height="6"><animate attributeName="y" values="20;18;20" dur="0.4s" repeatCount="indefinite"/></rect><rect x="30" y="20" width="4" height="6"><animate attributeName="y" values="18;20;18" dur="0.4s" repeatCount="indefinite"/></rect></g></g></g></svg>