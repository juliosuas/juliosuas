name: Refresh profile evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install --yes fonts-dejavu-core
      - run: pip install Pillow==12.1.1
      - name: Render verified GitHub metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render-github-graphics.py
      - name: Commit changed evidence
        run: |
          if git diff --quiet -- assets/github-graphics.png assets/contribution-grid.png; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-graphics.png assets/contribution-grid.png
          git commit -m "chore: refresh profile evidence"
          git push
